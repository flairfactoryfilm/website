name: Keep Supabase Alive

on:
  schedule:
    # 매주 월요일·목요일 03:00 UTC (KST 12:00 정오)
    # Supabase 무료 플랜은 7일 비활동 시 일시정지되므로 주 2회 ping
    - cron: '0 3 * * 1,4'
  workflow_dispatch: # 수동 실행 가능

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase via REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "❌ SUPABASE_URL 또는 SUPABASE_ANON_KEY 시크릿이 설정되지 않았습니다."
            exit 1
          fi

          echo "🏓 Pinging Supabase at $(date -u) UTC..."

          # projects 테이블에서 1건만 가져옴 (id 컬럼만 선택해서 트래픽 최소화)
          HTTP_CODE=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            -X GET "${SUPABASE_URL}/rest/v1/projects?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")

          echo "HTTP status: $HTTP_CODE"
          echo "Response: $(cat /tmp/response.json)"

          # 2xx면 성공
          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "✅ Supabase ping 성공"
            exit 0
          else
            echo "❌ Supabase ping 실패 (HTTP $HTTP_CODE)"
            exit 1
          fi
